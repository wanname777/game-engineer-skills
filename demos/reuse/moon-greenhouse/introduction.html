<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>月面温室</title><style>
:root{--paper:#f5f1e7;--surface:#fffcf4;--ink:#163d2c;--muted:#516257;--line:#cbd2c4;--accent:#e9bf4d;--accent-ink:#163d2c;--green:#163d2c;--green-soft:#2b523b;--leaf:#a3bd83;--leaf-pale:#c7d7ac; --font-body:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;--font-display:ui-serif, 'Songti SC', 'STSong', serif}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.85 var(--font-body)}
main{max-width:none;margin:0;padding:0}
.hero{background:var(--green);color:var(--paper);padding:72px 48px 80px;overflow:hidden}
.hero-inner{max-width:1184px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
h1{font:500 clamp(46px,6.12vw,88px)/1.18 var(--font-display);letter-spacing:.02em;margin:0 0 36px;color:var(--paper)}
.read-link{display:inline-flex;align-items:center;justify-content:center;gap:32px;min-height:52px;padding:10px 24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:16px;text-decoration:none;font-weight:650}
.read-link:hover{background:var(--paper)}
.read-link .arrow{font-size:22px;line-height:1}
.greenhouse{display:block;width:100%;height:auto;max-height:328px}
.reading{max-width:1184px;margin:56px auto 0;display:grid;grid-template-columns:1.16fr 1fr;gap:24px}
section{border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:32px 36px;min-width:0}
section:first-child{grid-row:span 2;padding:40px}
h2{color:var(--ink);font-size:20px;font-weight:650;line-height:1.4;margin:0 0 18px;letter-spacing:.02em;scroll-margin-top:24px}
section:first-child h2{font-size:24px;margin-bottom:28px}
h2::before{display:block;font:500 12px/1 var(--font-body);letter-spacing:.16em;color:var(--muted);margin-bottom:14px}
section:nth-child(1) h2::before{content:'01'}
section:nth-child(2) h2::before{content:'02'}
section:nth-child(3) h2::before{content:'03'}
p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.9}
section:first-child p{font-size:21px;line-height:2;max-width:27em}
section:nth-child(3) p{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 18px;font:15px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:-.035em}
footer{max-width:1184px;margin:32px auto 0;padding:0 0 40px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:24px;font-size:13px;border-top:0}
footer p{font-size:13px}
.download-links{display:flex;gap:8px 20px;flex-wrap:wrap}
.download-links a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-underline-offset:5px}
a:focus-visible{outline:3px solid var(--ink);outline-offset:5px}
.hero a:focus-visible{outline:3px solid var(--paper);outline-offset:5px}
h2:focus{outline:2px solid var(--ink);outline-offset:8px}
@media(min-width:761px) and (max-width:1280px){.reading,footer{margin-left:48px;margin-right:48px}.hero-inner{gap:32px}}
@media(max-width:760px){
body{font-size:18px}.hero{padding:40px 24px 32px}.hero-inner{grid-template-columns:1fr;gap:28px}
h1{font-size:46px;margin-bottom:24px}.read-link{min-height:48px;padding:10px 20px;gap:24px}.greenhouse{max-height:212px}
.reading{margin:24px 24px 0;grid-template-columns:1fr;gap:16px}section,section:first-child{grid-row:auto;padding:24px;border-radius:20px}
h2,section:first-child h2{font-size:20px;margin-bottom:16px}h2::before{margin-bottom:12px}
section:first-child p{font-size:18px;line-height:1.95}
section:nth-child(3) p{font-size:14px;padding:14px 12px;letter-spacing:-.045em}
footer{margin:24px 24px 0;padding-bottom:32px;align-items:flex-start;flex-direction:column;gap:12px}
.download-links{gap:4px 18px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header class="hero"><div class="hero-inner"><div><h1>月面温室</h1><a class="read-link" href="#gameplay">阅读玩法<span class="arrow" aria-hidden="true">↙</span></a></div><svg class="greenhouse" viewBox="0 0 520 328" aria-hidden="true" focusable="false">

<circle cx="348" cy="228" r="13"/><circle cx="394" cy="199" r="14"/><circle cx="372" cy="192" r="13"/>
</g>

</svg></div></header><div class="reading"><section><h2 id="gameplay" tabindex="-1">玩法</h2><p>玩家在月球温室内布置三种种植格。每轮只能移动一个种植格，目标是在十轮内让所有植株获得光照。</p></section>
